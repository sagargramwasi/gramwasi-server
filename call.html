<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GramWasi Call</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100dvh;overflow:hidden}
  #remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;visibility:hidden}
  #localVideo{position:absolute;right:14px;top:86px;width:104px;height:148px;border-radius:16px;border:2px solid rgba(255,255,255,.35);background:#1c2733;object-fit:cover;z-index:5}
  .avatarBig{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 35%,#24384c,#0e1621);z-index:4}
  .avatarBig .circ{width:118px;height:118px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#2563eb);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.5)}
  .avatarBig .anm{font-size:21px;font-weight:700}
  .call-top{position:absolute;top:0;left:0;right:0;z-index:6;padding:16px 12px 34px;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none}
  .call-top .cn{text-align:center;font-size:23px;font-weight:700;margin-top:2px;text-shadow:0 1px 6px rgba(0,0,0,.65)}
  .call-top .cs{text-align:center;font-size:15px;color:#e8eef4;margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .call-controls{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:16px 6px 62px;background:linear-gradient(transparent,rgba(0,0,0,.55));display:flex;justify-content:space-around;max-width:460px;margin:0 auto;animation:rise .45s ease}
  @keyframes rise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
  .g-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
  .gbtn{width:56px;height:56px;border-radius:50%;border:3.5px solid transparent;background:linear-gradient(#ffffff,#ffffff) padding-box,linear-gradient(135deg,#e879f9,#7c3aed) border-box;box-shadow:0 0 16px rgba(168,85,247,.5),0 6px 14px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,filter .2s;position:relative}
  .gbtn:active{transform:scale(.9)}
  .gbtn.off{filter:saturate(.25) brightness(.93)}
  .gbtn.flash{transform:scale(.9)}
  .gbtn.stopv{background:linear-gradient(#ffffff,#ffffff) padding-box,linear-gradient(135deg,#38bdf8,#2563eb) border-box;box-shadow:0 0 16px rgba(59,130,246,.5),0 6px 14px rgba(0,0,0,.35)}
  .gbtn.mute{background:linear-gradient(#ffffff,#ffffff) padding-box,linear-gradient(135deg,#4ade80,#16a34a) border-box;box-shadow:0 0 16px rgba(34,197,94,.5),0 6px 14px rgba(0,0,0,.35)}
  .gbtn.end{background:linear-gradient(#ffffff,#ffffff) padding-box,linear-gradient(135deg,#f87171,#dc2626) border-box;box-shadow:0 0 18px rgba(239,68,68,.6),0 6px 14px rgba(0,0,0,.35)}
  .gpill{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:5px 13px;border-radius:999px;font-weight:800;font-size:12.5px;color:#111;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.3);letter-spacing:.2px}
  #errBox{position:absolute;left:16px;right:16px;top:32%;background:rgba(18,24,32,.96);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:18px 16px;font-size:14.5px;line-height:1.55;display:none;z-index:9;text-align:center}
  #errBox button{background:#ff3b30;color:#fff;border:none;padding:10px 24px;border-radius:20px;font-size:15px;margin-top:12px;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(23,33,43,.96);border:1px solid rgba(255,255,255,.14);padding:10px 16px;border-radius:22px;font-size:14px;display:none;z-index:60;white-space:nowrap}
  body.audio #remoteVideo,body.audio #localVideo{display:none}
  body.audio .g-wrap.audiocam{display:none}
  body.audio .avatarBig{display:flex}
  body.nocam #localVideo{display:none}
  body.nocam .g-wrap.audiocam{display:none}
  body.nocam .avatarBig{display:flex}
  #errBox .errname{display:block;margin-top:8px;font-size:11.5px;color:#9fb3c8}
  #errBox button.alt{background:#2b7cd3;margin-left:8px}
</style>
</head>
<body>
<video id="remoteVideo" autoplay playsinline></video>
<div class="avatarBig" id="avatarBig"><div class="circ" id="avatarInit">?</div><div class="anm" id="avatarName"></div></div>
<video id="localVideo" autoplay playsinline muted></video>
<div class="call-top">
  <div class="cn" id="peerName">Call</div>
  <div class="cs" id="callStatus">Connecting…</div>
</div>
<div id="errBox"></div>
<div class="call-controls">
  <div class="g-wrap audiocam"><button class="gbtn flip" id="flipBtn" aria-label="Flip camera"><svg viewBox="0 0 24 24" width="27" height="27"><path fill="#111" d="M8.2 6.4 9.6 4.2h4.8l1.4 2.2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.4a2 2 0 0 1 2-2h3.2z"/><path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" d="M8.5 13.3a3.6 3.6 0 0 1 6.3-1.9"/><path fill="#fff" d="M15.7 8.5l.2 3.5-3.3-1.3z"/><path fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" d="M15.5 15.1a3.6 3.6 0 0 1-6.3 1.9"/><path fill="#fff" d="M8.3 19.9l-.2-3.5 3.3 1.3z"/></svg></button><div class="gpill">Flip</div></div>
  <div class="g-wrap audiocam"><button class="gbtn stopv" id="camBtn" aria-label="Stop video"><svg viewBox="0 0 24 24" width="27" height="27"><path fill="#111" d="M3 8.2A2.2 2.2 0 0 1 5.2 6h8.6A2.2 2.2 0 0 1 16 8.2v7.6a2.2 2.2 0 0 1-2.2 2.2H5.2A2.2 2.2 0 0 1 3 15.8V8.2z"/><path fill="#111" d="M16 10.7l5-2.9v8.4l-5-2.9z"/></svg></button><div class="gpill">Stop Video</div></div>
  <div class="g-wrap"><button class="gbtn mute" id="muteBtn" aria-label="Mute"><svg viewBox="0 0 24 24" width="26" height="26"><rect x="9" y="2.4" width="6" height="11" rx="3" fill="#111"/><path d="M5.8 11.2a6.2 6.2 0 0 0 12.4 0" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/><line x1="12" y1="17.6" x2="12" y2="20.4" stroke="#111" stroke-width="2" stroke-linecap="round"/><line x1="8.4" y1="20.8" x2="15.6" y2="20.8" stroke="#111" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="4.5" x2="19" y2="19.5" stroke="#111" stroke-width="2.2" stroke-linecap="round"/></svg></button><div class="gpill">Mute</div></div>
  <div class="g-wrap"><button class="gbtn end" id="endBtn" aria-label="End call"><svg viewBox="0 0 24 24" width="28" height="28"><path fill="#111" d="M12 9c-2.9 0-5.7.6-8.2 1.7-.5.3-.7 1-.4 1.6l1.3 2.7c.2.5.8.7 1.3.5 1.3-.7 2.7-1 4.1-1 .3 0 .7.2.9.5l1 1.7c.2.4.7.6 1.2.4 1.5-.5 3.1-.7 4.8-.7s3.3.2 4.8.7c.5.2 1 0 1.2-.4l1-1.7c.2-.3.6-.5.9-.5 1.4 0 2.8.3 4.1 1 .5.2 1.1 0 1.3-.5l1.3-2.7c.3-.6.1-1.3-.4-1.6C17.7 9.6 14.9 9 12 9z"/></svg></button><div class="gpill">End Call</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
var $=function(id){return document.getElementById(id);};
var qs=new URLSearchParams(location.search);
var ME=qs.get("me")||"", PEER=qs.get("peer")||"", PNAME=qs.get("name")||PEER,
    MODE=(qs.get("mode")==="audio")?"audio":"video",
    ROLE=(qs.get("role")==="callee")?"callee":"caller",
    CALLID=qs.get("callid")||"",
    SERVER=(qs.get("server")||"").replace(/\/+$/,"");
var ICE_SERVERS=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},{urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},{urls:"turns:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}];

var pc=null, localStream=null, facing="user", vSender=null;
var videoTrackOn=(MODE==="video"), muted=false, flipping=false;
var remoteDescSet=false, iceQueue=[], lastSigId=0, seenSigs={};
var pollTimer=null, timerInt=null, callSec=0, connected=false, ended=false;
var ringTimeout=null, dotTimer=null;
var camFailed=false, permShown=false;

$("peerName").textContent=PNAME;
$("avatarName").textContent=PNAME;
$("avatarInit").textContent=(PNAME||"?").trim().charAt(0).toUpperCase()||"?";
if(MODE==="audio")document.body.classList.add("audio");

function toast(t){var e=$("toast");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none";},2600);}
function setStatus(t){$("callStatus").textContent=t;}
function startDots(label){var n=1;stopDots();dotTimer=setInterval(function(){if(connected)return;n=n%3+1;setStatus(label+" "+"•".repeat(n));},600);setStatus(label+" •");}
function stopDots(){if(dotTimer){clearInterval(dotTimer);dotTimer=null;}}
function fmtTime(s){var m=Math.floor(s/60);return m+":"+(s%60<10?"0":"")+(s%60);}
function closePage(){
  try{ if(window.CallHost&&CallHost.close){CallHost.close();return;} }catch(e){}
  try{ window.close(); }catch(e){}
  try{ history.back(); }catch(e){}
}

/* ---------------- signaling ---------------- */
function sendSignal(payload){
  payload.callid=CALLID;
  try{
    fetch(SERVER+"/call/signal",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({from:ME,to:PEER,payload:payload})}).catch(function(){});
  }catch(e){}
}
function pollSignals(){
  try{
    fetch(SERVER+"/call/signals?user="+encodeURIComponent(ME)+"&with="+encodeURIComponent(PEER)+"&since="+lastSigId)
    .then(function(r){return r.json();})
    .then(function(j){
      var list=(j&&j.signals)||[];
      list.forEach(function(s){
        if(s.id>lastSigId)lastSigId=s.id;
        if(seenSigs[s.id])return; seenSigs[s.id]=1;
        if(s.from!==PEER)return;
        var pl=s.payload||{};
        if(pl.callid!==CALLID)return;
        handleSignal(pl);
      });
    }).catch(function(){});
  }catch(e){}
}
function startPolling(){ if(pollTimer)return; pollTimer=setInterval(pollSignals,1000); pollSignals(); }

/* ---------------- media helpers ---------------- */
function liveVideoTrack(){
  if(!localStream)return null;
  var ts=localStream.getVideoTracks();
  for(var i=0;i<ts.length;i++)if(ts[i].readyState==="live")return ts[i];
  return null;
}
function videoSender(){ return vSender; }
function addLocalTracks(){
  localStream.getTracks().forEach(function(t){
    var snd=pc.addTrack(t,localStream);
    if(t.kind==="video")vSender=snd;
  });
}
function refreshPreview(){
  if(!localStream)return;
  var tracks=[];
  var at=localStream.getAudioTracks()[0]; if(at)tracks.push(at);
  var vt=liveVideoTrack(); if(vt)tracks.push(vt);
  $("localVideo").srcObject=new MediaStream(tracks);
}
function videoCons(face){
  return {facingMode:face,width:{ideal:640},height:{ideal:480},frameRate:{max:30}};
}
async function getMedia(){
  if(MODE==="audio"){
    try{ return await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }
    catch(e){ showPermError(e); throw e; }
  }
  try{ return await navigator.mediaDevices.getUserMedia({audio:true,video:videoCons(facing)}); }
  catch(e){
    if(e&&e.name==="NotAllowedError"){ showPermError(e); throw e; }
    // Camera kisi aur wajah se atak gaya (busy/overconstrained/notfound):
    // ek baar bilkul saada constraints se, phir sirf awaaz se koshish.
    try{ return await navigator.mediaDevices.getUserMedia({audio:true,video:true}); }
    catch(e2){
      if(e2&&e2.name==="NotAllowedError"){ showPermError(e2); throw e2; }
      var s;
      try{ s=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }
      catch(e3){ showPermError(e3); throw e3; }
      camFailed=true;
      return s;
    }
  }
}
function applyCamFailed(){
  document.body.classList.add("nocam");
  videoTrackOn=false;
  toast("Camera nahi mila — voice call chal raha hai");
}
function showPermError(err){
  permShown=true;
  stopDots();setStatus("Permission nahi mili");
  var eb=$("errBox");eb.style.display="block";
  var nm=(err&&err.name)?('<span class="errname">Error: '+err.name+'</span>'):"";
  eb.innerHTML="📷 <b>Camera/mic ki permission nahi mili.</b><br>Phone ki Settings me GramWasi app ko Camera + Microphone <b>Allow</b> karo, phir dobara call karo."+nm+"<br><button onclick=\"gwReqPerms()\" class=\"alt\">Permission dobara maango</button><button onclick=\"endCall(false)\">Band karo</button>";
}
function gwReqPerms(){
  try{ if(window.CallHost&&CallHost.requestPerms){ CallHost.requestPerms(); return; } }catch(e){}
  toast("Settings me jaakar permission Allow karo");
}
window.gwReqPerms=gwReqPerms;

/* ---------------- peer connection ---------------- */
function makePc(){
  pc=new RTCPeerConnection({iceServers:ICE_SERVERS});
  pc.onicecandidate=function(e){ if(e.candidate)sendSignal({t:"ice",cand:e.candidate}); };
  pc.ontrack=function(e){
    if(e.streams&&e.streams[0]){ $("remoteVideo").srcObject=e.streams[0]; $("remoteVideo").style.visibility="visible"; }
    if(MODE==="video"&&!camFailed)$("avatarBig").style.display="none";
  };
  pc.onconnectionstatechange=function(){
    if(!pc)return;
    if(pc.connectionState==="connected"){
      connected=true;stopDots();
      if(ringTimeout){clearTimeout(ringTimeout);ringTimeout=null;}
      callSec=0;setStatus("0:00");
      if(timerInt)clearInterval(timerInt);
      timerInt=setInterval(function(){callSec++;setStatus(fmtTime(callSec));},1000);
    }else if(pc.connectionState==="failed"){
      setStatus("Connection fail ho gaya");
      toast("Network ki wajah se call nahi jud payi");
      setTimeout(function(){endCall(false);},1800);
    }else if(pc.connectionState==="disconnected"){
      if(connected)setStatus("Network atak raha hai…");
    }
  };
}
async function flushIce(){
  if(!remoteDescSet)return;
  while(iceQueue.length){
    var c=iceQueue.shift();
    try{await pc.addIceCandidate(c);}catch(e){}
  }
}
async function handleSignal(pl){
  if(ended)return;
  if(pl.t==="bye"){ toast("📞 Call khatm"); cleanup(); setTimeout(closePage,650); return; }
  if(pl.t==="ice"){
    if(!pl.cand)return;
    if(remoteDescSet&&pc){ try{await pc.addIceCandidate(pl.cand);}catch(e){} }
    else iceQueue.push(pl.cand);
    return;
  }
  if(ROLE==="caller"&&pl.t==="answer"){
    if(!pc||remoteDescSet)return;
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(pl.sdp));
      remoteDescSet=true; setStatus("Jud raha hai…"); await flushIce();
    }catch(e){}
    return;
  }
  if(ROLE==="callee"&&pl.t==="offer"){
    if(!pc||remoteDescSet)return;
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(pl.sdp));
      remoteDescSet=true; await flushIce();
      var ans=await pc.createAnswer();
      await pc.setLocalDescription(ans);
      sendSignal({t:"answer",sdp:pc.localDescription});
      setStatus("Jud raha hai…");
    }catch(e){}
    return;
  }
}

/* ---------------- flows ---------------- */
async function startCaller(){
  startDots("Ringing");
  sendSignal({t:"ring",mode:MODE});
  try{ localStream=await getMedia(); }
  catch(e){ sendSignal({t:"bye"}); if(!permShown)showPermError(e); return; }
  if(camFailed)applyCamFailed();
  refreshPreview();
  makePc();
  addLocalTracks();
  startPolling();
  try{
    var offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    sendSignal({t:"offer",mode:MODE,sdp:pc.localDescription});
  }catch(e){ toast("Call shuru nahi hui"); }
  ringTimeout=setTimeout(function(){
    if(!connected){ toast("Koi jawab nahi aaya"); sendSignal({t:"bye"}); cleanup(); setTimeout(closePage,900); }
  },45000);
}
async function startCallee(){
  setStatus("Connecting…");
  try{ localStream=await getMedia(); }
  catch(e){ sendSignal({t:"bye"}); if(!permShown)showPermError(e); return; }
  if(camFailed)applyCamFailed();
  refreshPreview();
  makePc();
  addLocalTracks();
  startPolling();
  ringTimeout=setTimeout(function(){
    if(!connected){ toast("Call jud nahi payi"); cleanup(); setTimeout(closePage,900); }
  },60000);
}

/* ---------------- controls ---------------- */
function cleanup(){
  ended=true; stopDots();
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(ringTimeout){clearTimeout(ringTimeout);ringTimeout=null;}
  try{if(pc)pc.close();}catch(e){}
  pc=null;
  if(localStream){localStream.getTracks().forEach(function(t){try{t.stop();}catch(e){}});localStream=null;}
}
function endCall(notifyPeer){
  if(ended){closePage();return;}
  if(notifyPeer!==false)sendSignal({t:"bye"});
  cleanup();
  closePage();
}
window.endCall=endCall;
$("endBtn").addEventListener("click",function(){endCall(true);});

$("muteBtn").addEventListener("click",function(){
  if(!localStream)return;
  muted=!muted;
  localStream.getAudioTracks().forEach(function(t){t.enabled=!muted;});
  this.classList.toggle("off",muted);
  toast(muted?"Mic band":"Mic chalu");
});

/* Robust camera flip (glitch fix):
   - flip chal raha ho to dobara tap ignore
   - camera OFF ho to sirf facingMode badlo (track chhedo mat)
   - pehle NAYA camera lo; fail ho to purana hi chalta rahe
   - replaceTrack safal ho JANE KE BAAD hi purana track band karo */
$("flipBtn").addEventListener("click",async function(){
  if(flipping||!localStream||MODE==="audio")return;
  var btn=this; btn.classList.add("flash");
  setTimeout(function(){btn.classList.remove("flash");},350);
  var target=(facing==="user")?"environment":"user";
  if(!videoTrackOn||!liveVideoTrack()){ facing=target; toast("Camera badal gaya"); return; }
  flipping=true;
  var ns=null;
  try{ ns=await navigator.mediaDevices.getUserMedia({video:videoCons(target),audio:false}); }
  catch(e){ flipping=false; toast("Camera flip nahi hua"); return; }
  var nt=ns.getVideoTracks()[0];
  var old=liveVideoTrack();
  try{
    var sender=videoSender();
    if(sender){ await sender.replaceTrack(nt); }
    else if(pc){ vSender=pc.addTrack(nt,localStream); }
  }catch(e){
    try{nt.stop();}catch(e2){}
    flipping=false; toast("Camera flip nahi hua"); return;
  }
  // replace safal — ab local stream/preview badlo aur purana track band karo
  if(old){ try{localStream.removeTrack(old);}catch(e){} }
  localStream.addTrack(nt);
  if(old){ try{old.stop();}catch(e){} }
  facing=target;
  refreshPreview();
  flipping=false;
});

/* Stop Video: track band karke sender khali; dobara chalu par facingMode
   ke hisaab se naya track lekar replaceTrack */
$("camBtn").addEventListener("click",async function(){
  if(!localStream||MODE==="audio")return;
  var btn=this;
  if(videoTrackOn){
    videoTrackOn=false; btn.classList.add("off");
    var vt=liveVideoTrack();
    var sender=videoSender();
    try{ if(sender)await sender.replaceTrack(null); }catch(e){}
    if(vt){ try{localStream.removeTrack(vt);}catch(e){} try{vt.stop();}catch(e){} }
    $("localVideo").srcObject=null;
    if(connected)$("avatarBig").style.display="flex";
    toast("Video band");
  }else{
    try{
      var ns=await navigator.mediaDevices.getUserMedia({video:videoCons(facing),audio:false});
      var nt=ns.getVideoTracks()[0];
      localStream.addTrack(nt);
      var s2=videoSender();
      if(s2){ try{await s2.replaceTrack(nt);}catch(e){} }
      else if(pc){ vSender=pc.addTrack(nt,localStream); }
      videoTrackOn=true; btn.classList.remove("off");
      if(connected)$("avatarBig").style.display="none";
      refreshPreview();
      toast("Video chalu");
    }catch(e){ toast("Camera nahi mila"); }
  }
});

/* ---------------- boot ---------------- */
if(MODE==="video")$("avatarBig").style.display="flex";
if(!ME||!PEER||!CALLID||!SERVER){ setStatus("Call link adhoora hai"); var eb2=$("errBox"); eb2.style.display="block"; eb2.innerHTML="⚠️ <b>Call link adhoora hai.</b><br>App se dobara call karo.<br><button onclick=\"endCall(false)\">Band karo</button>"; }
else if(ROLE==="caller"){ startCaller(); }
else{ startCallee(); }
</script>
</body>
</html>
